[project]
name = "localization-uav"
version = "0.1.0"
description = "6-DoF UAV visual geo-localization from video anchored in public 3D geodata and replayed on 3D Tiles."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Core scientific / vision / geo stack (aligned with OrthoTrack + Open3D 0.18)
    "numpy>=1.26.0,<2",
    "opencv-python>=4.10.0.84,<5",
    "scipy>=1.14.0",
    "pillow>=10.4.0",
    "tqdm>=4.66.5",
    "einops>=0.8.0",
    "matplotlib>=3.9.2",
    "rasterio>=1.3.10",
    "pyproj>=3.6.1",
    "pandas>=2.0.0",
    "loguru>=0.7.0",
    # Deep learning + RoMaV2 + VPR (MegaLoc / Sample4Geo)
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "kornia>=0.7.3",
    "rich>=14.2.0",
    "timm>=1.0.0",
    "huggingface-hub>=0.25.0",
    "safetensors>=0.4.5",
    "gdown>=5.2.0",
    "fused-local-corr; sys_platform == 'linux'",
    # Video decoding
    # shortcut: decord has no macOS wheels; OrthoTrack falls back to OpenCV when it is missing
    "decord>=0.6.0; sys_platform == 'linux'",
    # Mesh / rendering
    "trimesh>=4.0",
    "PyOpenGL>=3.1",
    "open3d==0.18.0",
    # Geodata fetching (swisstopo STAC API)
    "pystac-client>=0.8.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
]

[tool.uv]
package = false
